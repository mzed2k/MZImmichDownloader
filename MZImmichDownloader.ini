; SyncImmich.ini
; Muss im selben Verzeichnis liegen und denselben Basenamen wie die EXE tragen,
; also z. B. "SyncImmich.exe" -> "SyncImmich.ini".
;
; Zeilen, die mit # oder ; beginnen, sind Kommentare.
; Alle Werte koennen zusaetzlich per Kommandozeilen-Parameter ueberschrieben werden
; (siehe SyncImmich.exe --help).

ImmichBaseUrl   = https://immich.example.com
ApiKey          = dein_api_key
OutputDir       = C:\ImmichSync
PageSize        = 300

; DownloadDays = 0 zum Deaktivieren
DownloadDays    = 14

; DateFilterMode mögliche Werte: created oder taken
DateFilterMode  = taken

; NEU: Dateigroessenpruefung ein-/ausschalten.
; true  = Downloads werden gegen exifInfo.fileSizeInByte geprueft (Standard, empfohlen)
; false = Groessenpruefung wird uebersprungen; nur ein 0-Byte-Sanity-Check bleibt aktiv
CheckFileSize   = true

; NEU: Ausgabe-Verbosity.
; SILENT = nur Fehler werden angezeigt
; NOTICE = normale Statusmeldungen (Standard)
; DEBUG  = zusaetzlich technische Detailausgaben (Rohantworten, URLs, ...)
LogLevel        = DEBUG
